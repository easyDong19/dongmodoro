# 태그를 밀면 `.dmg` 를 만들어 GitHub Releases 에 올린다 (ADR-004).
#
# 트리거가 **둘**인 것이 이 파일의 핵심이다. 태그만으로 돌게 하면 첫 릴리스를 검증하는
# 방법이 "태그를 달아 보는 것"뿐이고, 실패하면 이미 밀어 버린 태그를 지우는 일부터
# 하게 된다. `workflow_dispatch` 는 그 리허설 자리이며, 업로드 없이 아티팩트만 남긴다.
#
# ci.yml 을 재사용하지 않고 설치 단계를 복사한다. 두 워크플로의 실패가 서로를 가리면
# 안 된다는 것이 pr-language.yml 을 흡수하지 않은 이유와 같다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 릴리스 업로드에 필요하다. 리허설 실행에는 필요 없지만 잡 단위라 함께 열린다.
permissions:
  contents: write

jobs:
  macos:
    # macOS 러너여야 한다 — `.dmg` 는 다른 OS 에서 만들 수 없다. v1.0.0 의 배포 대상이
    # macOS 하나인 것은 켤 수 없는 OS 의 산출물을 검증된 것처럼 올리지 않기 위해서다.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # 이 버전의 노트 파일이 곧 릴리스 본문이다. 없으면 여기서 죽인다.
      #
      # **이 스텝이 없으면 안전장치가 아예 없다.** action-gh-release 는 `body_path` 읽기
      # 실패를 삼키고 경고만 찍은 뒤 넘어가므로, 파일을 빠뜨려도 잡은 초록이고 draft 본문만
      # 조용히 커밋 목록으로 비어 있다 — 사람이 알아채지 못하고 publish 하는 것이 바로
      # ADR-032 가 막으려는 실패다.
      #
      # checkout 바로 뒤인 이유는 빌드 10분을 태우기 전에 20초 만에 끝내기 위해서다.
      # 여기서 죽으면 릴리스 객체도 에셋도 draft 도 만들어지지 않아 바깥으로 나간 것이 없다.
      - name: Resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          path="docs/release-notes/${version}.md"
          if [ ! -f "$path" ]; then
            echo "::error::$path not found. See CONTRIBUTING.md 2-2 and ADR-032."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # setup-node 의 `cache: pnpm` 보다 먼저 와야 한다 — 캐시 경로를 pnpm 으로 푼다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 릴리스가 깨진 코드를 싣지 않게 한다. CI 가 PR 에서 이미 돌지만 태그는 PR 을
      # 거치지 않을 수 있고(핫픽스 백포트), 그 경로에도 최소한의 그물이 있어야 한다.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # 애드혹 서명이며 공증하지 않는다 (ADR-028) — electron-builder.yml 의 `identity: '-'`.
      #
      # `pnpm dist` 는 `--publish never` 를 달고 있다. electron-builder 는 **CI 를 감지하면
      # 스스로 배포를 시도하고**, 토큰이 없으면 `.dmg` 를 다 만들어 놓고 마지막에
      # `GitHub Personal Access Token is not set` 으로 잡을 죽인다. 리허설이 이걸 잡았다.
      # 배포자는 아래 한 스텝뿐이어야 한다 — 둘이면 어느 쪽이 올렸는지 알 수 없어진다.
      - name: Build dmg
        run: pnpm dist

      # 실패한 실행에서도 올린다 — 실패한 빌드의 로그·중간 산출물이 성공한 것보다 쓸모 있다.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: release/*.dmg
          if-no-files-found: ignore
          # 이 아티팩트는 **사람이 한 번 확인하면 역할이 끝난다** — 리허설에서는 `.dmg` 가
          # 나왔다는 증거이고, 태그 실행에서는 같은 파일이 릴리스 에셋으로 따로 올라간다.
          # 7일을 두니 실행마다 207MB 가 겹쳐 쌓여 1.2GB 가 됐다. 릴리스 에셋과 달리
          # 아티팩트는 저장 용량에 산입되므로(릴리스 쪽은 무제한·무과금), 확인에 필요한
          # 만큼만 남긴다.
          retention-days: 2

      # 자동 목록의 기준점을 **직접 정한다.** 지정하지 않으면 GitHub 은 "이 태그의 조상 중
      # 가장 최근 태그" 를 기준으로 삼는데, 버전 범프 커밋이 release 브랜치에만 있어
      # (CONTRIBUTING §2) 지난 판의 태그가 이 태그의 조상이 아니다. v2.2.0 의 첫 draft 가
      # v2.1.0 을 건너뛰고 v2.0.0 과 비교되어, 이미 나간 PR 11개를 목록 18개 중에 다시
      # 나열했다 — 2.1.0 을 쓰던 사람에게는 그것이 새 변경으로 읽힌다.
      #
      # 기준점을 **가장 최근 publish 된 릴리스**로 잡으면 계보와 무관해진다. draft 를
      # 제외하는 이유는 이 워크플로가 만드는 draft 가 자기 자신을 기준으로 삼지 않게 하는
      # 것이고, 현재 태그를 제외하는 이유는 실패한 판을 다시 자를 때를 위한 것이다.
      #
      # 첫 릴리스에서는 값이 빈 문자열이 되고, 그때는 액션이 이 입력을 무시해 GitHub 의
      # 기본 동작으로 돌아간다 — 기준점이 없는 것이 맞는 유일한 경우다.
      - name: Resolve changelog base
        id: base
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json tagName,isDraft \
            --jq "[.[] | select(.isDraft == false and .tagName != \"$GITHUB_REF_NAME\") | .tagName] | first")
          echo "base=${prev}" >> "$GITHUB_OUTPUT"
          echo "changelog base: ${prev:-(none — first release)}"

      # 태그로 들어온 실행만 배포한다. 리허설(`workflow_dispatch`)은 위의 아티팩트까지다.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.dmg
          draft: true
          generate_release_notes: true
          previous_tag: ${{ steps.base.outputs.base }}
          # 파일 내용이 자동 생성 노트 **앞에** 붙는다 — 변환은 없다. 저장소의 파일이
          # 바이트 그대로 본문 위쪽이 되고, 그 아래에 커밋 목록이 따라온다. 사람이
          # 붙여 넣던 단계가 사라지는 자리다 (CONTRIBUTING §2).
          body_path: ${{ steps.notes.outputs.path }}
