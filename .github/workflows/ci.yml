# 타입체크·린트·서식·단위 테스트·빌드·E2E 를 매 PR 에서 돌린다.
#
# 이 워크플로가 생기기 전까지 **`pnpm test` 는 어디서도 자동 실행되지 않았다.** CI 는
# PR 언어 검사 하나뿐이었고, husky 는 pre-commit(lint-staged)·pre-push(브랜치 보호)·
# commit-msg(commitlint)만 봤다. 타입체크와 단위 테스트에 자동 실행 지점이 아예 없었다.
# E2E 만 얹으면 지붕부터 얹는 셈이라 나머지를 함께 세운다.
#
# pr-language.yml 을 흡수하지 않는다 — 트리거 조건(제목·본문 edited)이 다르고,
# 합치면 한쪽 실패가 다른 쪽을 가린다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 연달아 push 하면 앞 실행을 취소한다. main 은 취소하지 않는다 —
# 머지된 커밋의 검사 결과는 남아 있어야 한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node 의 `cache: pnpm` 보다 먼저 와야 한다 — 캐시 경로를 pnpm 으로 푼다.
      # 버전은 package.json 의 packageManager 필드에서 읽는다 (단일 출처).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 스텝을 하나로 묶지 않는다 — 묶으면 무엇이 깨졌는지 로그를 뒤져야 한다.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # E2E 는 개발 서버가 아니라 빌드 산출물을 띄운다 (e2e/fixtures/app.ts).
      - name: Build
        run: pnpm build

      # Electron 이 헤드리스 Linux 에서 뜨려면 Chromium 의 시스템 라이브러리가 필요하다.
      # 패키지 이름을 손으로 열거하지 않는다 — Ubuntu 24.04 가 여러 패키지를 t64 접미사로
      # 개명해서 손 열거는 이미지 갱신마다 깨진다. Playwright 가 유지하는 이 명령이
      # 배포판별 차이를 흡수한다. 브라우저 바이너리는 내려받지 않는다(`install-deps` 뿐).
      - name: Install Electron system libraries
        run: pnpm exec playwright install-deps chromium

      # xvfb = 가상 디스플레이. 없으면 창을 만들지 못하고 기동 자체가 실패한다.
      #
      # dbus-run-session 은 **종료가 멈추는 것**을 막는다. 세션 버스가 없으면 Chromium 이
      # `Failed to connect to the bus` 를 내고, 종료 경로의 동기 D-Bus 호출이 응답을 기다리며
      # 블록된다(기본 타임아웃 25초). 첫 CI 실행에서 단언은 전부 통과했는데 teardown 만
      # 30초를 넘겨 실패했고, 멈추기 직전 마지막 로그가 그 오류였다.
      - name: E2E
        run: xvfb-run -a dbus-run-session -- pnpm test:e2e

      # 실패했을 때도 올린다 — 실패한 실행의 스크린샷이 성공한 실행의 것보다 쓸모 있다.
      # 스크린샷 회귀 비교는 하지 않는다(OS 별 폰트 렌더링 차이). 비교는 사람이 한다.
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
