# 타입체크·린트·서식·단위 테스트·빌드·E2E 를 매 PR 에서 돌린다.
#
# 이 워크플로가 생기기 전까지 **`pnpm test` 는 어디서도 자동 실행되지 않았다.** CI 는
# PR 언어 검사 하나뿐이었고, husky 는 pre-commit(lint-staged)·pre-push(브랜치 보호)·
# commit-msg(commitlint)만 봤다. 타입체크와 단위 테스트에 자동 실행 지점이 아예 없었다.
# E2E 만 얹으면 지붕부터 얹는 셈이라 나머지를 함께 세운다.
#
# pr-language.yml 을 흡수하지 않는다 — 트리거 조건(제목·본문 edited)이 다르고,
# 합치면 한쪽 실패가 다른 쪽을 가린다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 연달아 push 하면 앞 실행을 취소한다. main 은 취소하지 않는다 —
# 머지된 커밋의 검사 결과는 남아 있어야 한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node 의 `cache: pnpm` 보다 먼저 와야 한다 — 캐시 경로를 pnpm 으로 푼다.
      # 버전은 package.json 의 packageManager 필드에서 읽는다 (단일 출처).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 스텝을 하나로 묶지 않는다 — 묶으면 무엇이 깨졌는지 로그를 뒤져야 한다.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # ── E2E ────────────────────────────────────────────────────────────────
      #
      # 한동안 여기서 돌지 못했다. 러너에서 단언은 전부 통과하는데 `app.quit()` 에 앱이
      # 반응하지 않아 teardown 이 30초를 넘겼고, 원인을 Linux 쪽(세션 버스·런타임 다운로드·
      # CDP ack 유실)에서 찾다가 셋 다 기각한 채 보류했다.
      #
      # 원인은 플랫폼이 아니라 종료 순서였다 — `before-quit` 에서 DB 를 닫아 놓고 그 뒤에
      # 창의 close 핸들러가 그 DB 를 읽었고, main 의 예외가 에러 박스로 떠서 종료를 붙잡았다
      # (src/main/index.ts 의 `will-quit` 주석). macOS 에서 같은 증상을 재현하고 고친 뒤
      # 종료가 35초 타임아웃에서 143ms 로 떨어졌다. 이 스텝이 Linux 에서도 같은 원인이었는지
      # 판정한다.
      - name: Install Electron system libraries
        run: pnpm exec playwright install-deps chromium

      - name: E2E
        run: xvfb-run -a dbus-run-session -- pnpm test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
