# 타입체크·린트·서식·단위 테스트·빌드·E2E 를 매 PR 에서 돌린다.
#
# 이 워크플로가 생기기 전까지 **`pnpm test` 는 어디서도 자동 실행되지 않았다.** CI 는
# PR 언어 검사 하나뿐이었고, husky 는 pre-commit(lint-staged)·pre-push(브랜치 보호)·
# commit-msg(commitlint)만 봤다. 타입체크와 단위 테스트에 자동 실행 지점이 아예 없었다.
# E2E 만 얹으면 지붕부터 얹는 셈이라 나머지를 함께 세운다.
#
# pr-language.yml 을 흡수하지 않는다 — 트리거 조건(제목·본문 edited)이 다르고,
# 합치면 한쪽 실패가 다른 쪽을 가린다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 연달아 push 하면 앞 실행을 취소한다. main 은 취소하지 않는다 —
# 머지된 커밋의 검사 결과는 남아 있어야 한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node 의 `cache: pnpm` 보다 먼저 와야 한다 — 캐시 경로를 pnpm 으로 푼다.
      # 버전은 package.json 의 packageManager 필드에서 읽는다 (단일 출처).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 스텝을 하나로 묶지 않는다 — 묶으면 무엇이 깨졌는지 로그를 뒤져야 한다.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # ── E2E 는 아직 여기서 돌지 않는다 (보류) ────────────────────────────────
      #
      # 하네스는 완성돼 있고 macOS 로컬에서 통과한다(`pnpm test:e2e:build`). CI 에 넣지
      # 못하는 이유는 하네스가 아니라 **앱이 Linux 에서 종료되지 않기 때문**이다.
      #
      # 실측: 단언은 러너에서도 전부 통과한다 — 앱이 뜨고 카드 3장이 렌더된다. 그 다음
      # `app.quit()` 에 프로세스가 반응하지 않고 `exit` 이벤트조차 오지 않아 teardown 이
      # 30초를 넘긴다. macOS 에서는 1초 안에 죽는다. 세 가설을 세워 셋 다 기각했다.
      #
      #   1. 세션 버스 부재       → dbus-run-session 으로 오류는 사라졌으나 멈춤은 그대로
      #   2. 실행 중 Electron 다운로드 → 정상 동작이다 (v42+ 는 설치 스크립트가 없다,
      #                                 pnpm-workspace.yaml 참조)
      #   3. 프로세스는 죽고 CDP ack 만 유실 → 종료와 경쟁시켜도 동일. exit 이벤트가 안 온다
      #
      # 강제 kill 로 초록을 만들지 않는다 — Linux 는 배포 대상 OS 이고(PRODUCT.md),
      # 거기서 앱이 안 죽는다는 사실을 CI 초록으로 덮는 것이 된다. 종료 경로를 고친 뒤
      # 아래 세 스텝을 되살린다.
      #
      #   - name: Install Electron system libraries
      #     run: pnpm exec playwright install-deps chromium
      #   - name: E2E
      #     run: xvfb-run -a dbus-run-session -- pnpm test:e2e
      #   - name: Upload E2E artifacts
      #     if: always()
      #     uses: actions/upload-artifact@v4
      #     with:
      #       name: e2e-artifacts
      #       path: |
      #         e2e-artifacts/
      #         playwright-report/
      #         test-results/
      #       if-no-files-found: ignore
      #       retention-days: 7
