# 패키징 설정 (ADR-004). 산출물은 GitHub Releases 에 올려 수동 다운로드로 배포한다.
#
# 여기서 정하는 것은 **무엇을 함께 실을 것인가**이며, 그 판단이 이 앱에서는 두 가지로
# 좁혀진다: 마이그레이션 `.sql` 파일과 better-sqlite3 의 네이티브 바이너리. 둘 다
# 개발 모드에서는 그냥 파일 시스템에 있어서 보이지 않다가, asar 아카이브로 들어가는
# 순간 각자 다른 이유로 깨진다.
appId: com.easydong.dongmodoro
productName: dongmodoro
copyright: Copyright © 2026 easyDong19

directories:
  # `build/` 가 buildResources 기본값이다 — 아이콘(icon.icns)을 여기서 찾는다.
  output: release

# 제외 목록으로 쓴다 — `files` 를 포함 목록으로 적으면 electron-builder 가 기본 규칙을
# 통째로 대체해서, 프로덕션 의존성(better-sqlite3 포함) 판정까지 우리가 떠안게 된다.
files:
  - '!src/*'
  - '!e2e/*'
  - '!e2e-artifacts/*'
  - '!test-results/*'
  - '!docs/*'
  - '!scripts/*'
  - '!playwright.config.ts'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!vitest.setup.ts'
  - '!tsconfig*.json'
  - '!eslint.config.js'
  - '!commitlint.config.js'
  - '!components.json'
  - '!drizzle.config.ts'

# 마이그레이션은 **asar 밖**에 있어야 한다. Drizzle 마이그레이터는 디렉토리를 실제
# 파일 시스템 경로로 읽고, `migrate.ts` 는 그 안의 `.sql` 개수를 세어 스키마 세대를
# 판정한다 (ADR-020 §6). 아카이브 안의 경로는 진짜 경로가 아니라 둘 다 실패한다.
# 앱은 `process.resourcesPath` 로 이 자리를 푼다 (src/main/index.ts).
extraResources:
  - from: drizzle
    to: drizzle

# 네이티브 모듈도 아카이브 밖에 남아야 한다 — `.node` 바이너리는 `dlopen` 으로 열리는데
# asar 경로는 OS 가 아는 경로가 아니다. 여기가 비면 앱은 DB 를 열지 못하고 시작 실패
# 대화상자로 빠진다 (ADR-020 §4).
asarUnpack:
  - '**/*.node'

mac:
  target: dmg
  category: public.app-category.productivity
  # 애드혹 서명 (ADR-028). 개발자 인증서 없이 서명하는 것이며 Gatekeeper 를 통과하지는
  # 못한다 — 공증이 없기 때문이다. 그래도 `null`(서명 생략)보다 낫다:
  #
  # `null` 로 두면 번들이 Electron 바이너리의 linker-signed 서명을 그대로 쓰고, 그 서명은
  # 리소스를 포함하지 않는다고 선언한다. 실측하면 `spctl` 이 평가 자체를 못 하고
  # `code has no resources but signature indicates they must be present` 로 끝난다.
  # 사용자에게는 "확인되지 않은 개발자"가 아니라 **손상된 앱**으로 보인다.
  #
  # `-` 는 번들 전체를 덮는 자기완결적 서명을 만든다. 여전히 확인되지 않은 개발자이지만
  # 그 판정에 도달은 하며, 그때는 시스템 설정에서 열 수 있다 (README 의 설치 절).
  identity: '-'
  # 애드혹 + hardened runtime 조합의 라이브러리 검증 예외. 파일 주석이 근거를 갖는다.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
